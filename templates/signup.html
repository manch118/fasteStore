<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eStore - Sign Up</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/indexo.css" />
    <link rel="stylesheet" href="/css/modern.css" />
  </head>
  <body class="auth-shell">
    <div class="background-layer"></div>
    <div class="reset-password-container">
      <div class="logo">
        <img src="/image/eso.png" alt="eStore logo" />
      </div>
      <h1>Create account</h1>
      <p>Join the store to save your cart, track orders, and get faster checkout on every visit.</p>

      <form action="/signup" method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" class="form-input" type="text" name="username" placeholder="Choose a username" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" class="form-input" type="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" class="form-input" type="password" name="password" placeholder="Create a password" required />
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input
            id="confirm_password"
            class="form-input"
            type="password"
            name="confirm_password"
            placeholder="Repeat your password"
            required
          />
        </div>
        <button class="form-button" type="submit">Create Account</button>
      </form>

      <a href="/login.html" class="back-link">Already have an account? Login</a>
      <a href="/index.html" class="back-link">Back to storefront</a>
    </div>
  </body>
</html>
